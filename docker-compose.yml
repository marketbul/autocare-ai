version: '3.8'

services:
  autocare-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocare_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AUTOCARE_DATABASE_URL=postgresql://autocare_user:autocare_pass@db:5432/autocare_db
      - AUTOCARE_ML_BACKEND=lite
      - AUTOCARE_GENERATION_MODE=extractive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autocare_net

  db:
    image: postgres:15-alpine
    container_name: autocare_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autocare_user
      POSTGRES_PASSWORD: autocare_pass
      POSTGRES_DB: autocare_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocare_user -d autocare_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autocare_net

  redis:
    image: redis:7-alpine
    container_name: autocare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - autocare_net

volumes:
  postgres_data:

networks:
  autocare_net:
    driver: bridge
